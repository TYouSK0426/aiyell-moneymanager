<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest?v=debug1" />
  <title>金銭管理（デバッグ）</title>
  <style>
    body{margin:0;background:#f7f7fb;color:#1f2353;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',ui-sans-serif}
    .banner{background:#fff8e1;border-bottom:1px solid #f5d27b;color:#7a5b00;padding:8px 12px;text-align:center;font-weight:700}
    .container{max-width:1100px;margin:24px auto;padding:0 16px}
    header{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
    .brand img{height:60px}
    .title-line{font-weight:800;letter-spacing:.12em;margin-top:6px}
    .balance-card{background:#fff;border:1px solid #eceaf5;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.06);padding:16px 22px;text-align:center;margin:10px 0}
    .balance-value{font-size:40px;font-weight:800;letter-spacing:.06em}
    .actions{display:flex;gap:24px;justify-content:center;align-items:center;width:100%;margin:8px 0 12px}
    .big-btn{flex:1 1 48%;max-width:460px;height:88px;border-radius:999px;border:1px solid;box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:32px;font-weight:900;letter-spacing:.3em;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .06s ease}
    .btn-income{background:#f2c8c8;border-color:#e5b4b4;color:#13164b}
    .btn-expense{background:#c9f3d7;border-color:#a8e7c0;color:#13164b}
    dialog{border:none;border-radius:24px;padding:0;max-width:760px;width:92%;background:#ffffff;color:#1f2353;box-shadow:0 28px 96px rgba(0,0,0,.35);border:1px solid #eceaf5;}
    .dialog-header{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid #eee}
    .dialog-body{padding:22px}
    .dialog-footer{display:flex;justify-content:flex-end;gap:10px;padding:18px 22px;border-top:1px solid #eee;background:#fff}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    label{font-size:14px;color:#8a8faf;font-weight:600}
    input, select, textarea{width:100%;border:1px solid #dcdbe7;background:#fff;color:#1f2353;padding:14px 16px;border-radius:12px;font-size:18px}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);z-index:9998}
  </style>
</head>
<body>
  <div class="banner">デバッグ版（サービスワーカーなし） — ボタンを押すと必ずダイアログが開くはずです</div>
  <div class="container">
    <header>
      <div class="brand"><img src="logo202212.png" alt="株式会社ELY｜NPO法人あい・えーる"></div>
      <div class="title-line">仁平伸一さん金銭管理システム</div>
      <div class="balance-card"><div class="balance-value" id="balance">¥ 0</div></div>
      <div class="actions">
        <button class="big-btn btn-income" id="btn-income">収　入</button>
        <button class="big-btn btn-expense" id="btn-expense">支　出</button>
      </div>
    </header>
  </div>

  <dialog id="editor">
    <form id="form" method="dialog">
      <div class="dialog-header"><strong id="dialogTitle">新規記録</strong><button type="button" id="closeDialog" style="background:transparent;border:none;font-size:22px;cursor:pointer">×</button></div>
      <div class="dialog-body">
        <input type="hidden" id="recordType" />
        <div class="grid">
          <div><label for="amount">金額</label><input id="amount" type="number" placeholder="例：2000" /></div>
          <div><label for="time">時間</label><input id="time" type="datetime-local" /></div>
          <div><label for="item">項目</label><select id="item"><option>お小遣い</option><option>バス代</option><option>移動支援</option><option>その他</option></select></div>
          <div><label for="operator">世話人</label><select id="operator"><option>阿部</option><option>雨宮</option><option>川越</option><option>矢野</option><option>緒澤</option><option>石田</option><option>島雄</option><option>趙</option></select></div>
        </div>
      </div>
      <div class="dialog-footer"><button type="button" id="cancelBtn">取り消し</button><button type="submit" id="saveBtn">保　存</button></div>
    </form>
  </dialog>
  <div id="overlay" class="overlay"></div>

  <script>
    const $ = (id)=>document.getElementById(id);
    const editor = $('editor'); const overlay = $('overlay');
    function openDialog(type){
      $('recordType').value = type;
      $('dialogTitle').textContent = type==='income' ? '新規収入' : '新規支出';
      const supportsDialog = typeof HTMLDialogElement==='function' && typeof editor.showModal === 'function';
      if(supportsDialog){ editor.showModal(); } else { editor.setAttribute('open',''); overlay.style.display='block'; }
    }
    function closeDialog(){
      if(typeof editor.close==='function'){ try{ editor.close(); }catch(e){} }
      editor.removeAttribute('open'); overlay.style.display='none';
    }
    document.getElementById('btn-income').addEventListener('click', ()=> openDialog('income'));
    document.getElementById('btn-expense').addEventListener('click', ()=> openDialog('expense'));
    document.getElementById('closeDialog').addEventListener('click', closeDialog);
    document.getElementById('cancelBtn').addEventListener('click', closeDialog);
  </script>
</body>
</html>
