<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>金銭管理</title>
  <style>
    body{margin:0;background:#f7f7fb;color:#1f2353;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
    header{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
    .brand img{height:60px;margin-bottom:8px}
    h1{font-size:20px;margin:0;color:#1f2353;font-weight:800;letter-spacing:.12em}
    .balance{text-align:center;margin:12px 0;font-size:36px;font-weight:800}
    .actions{display:flex;justify-content:center;gap:24px;margin:24px auto;width:90%}
    .actions button{flex:1;height:80px;font-size:28px;font-weight:900;border:none;border-radius:999px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:all .2s ease}
    .btn-income{background:#f2c8c8;color:#13164b}
    .btn-expense{background:#c9f3d7;color:#13164b}
    .card{background:#fff;border:1px solid #e8e6f0;border-radius:12px;padding:16px;margin:0 auto;max-width:1000px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
    .toolbar input[type=text]{flex:1;min-width:200px;border:1px solid #ccc;border-radius:8px;padding:8px}
    .export button{margin-left:8px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px 10px;border-bottom:1px solid #ddd}
    th{background:#faf9fe;color:#555}
    dialog{border:none;border-radius:20px;padding:0;max-width:720px;width:92%;background:#ffffff;color:#1f2353;box-shadow:0 24px 80px rgba(0,0,0,.3);border:1px solid #eceaf5}
    .dialog-header{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid #eee;font-weight:700;font-size:20px}
    .dialog-body{padding:20px}
    label{display:block;margin-bottom:6px;font-weight:600}
    input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-bottom:12px}
    .dialog-footer{display:flex;justify-content:space-between;align-items:center;padding:16px;border-top:1px solid #eee;background:#fafafa}
    .dialog-footer button{padding:12px 24px;border:none;border-radius:999px;font-size:18px;font-weight:700;cursor:pointer}
    .dialog-footer .save{background:#f2c8c8;color:#13164b}
    .dialog-footer .cancel{background:#dcd8ef;color:#13164b}
  </style>
</head>
<body>
  <header>
    <div class="brand"><img src="logo202212.png" alt="株式会社ELY｜NPO法人あい・えーる"></div>
    <h1>仁平伸一さん金銭管理システム</h1>
  </header>
  <div class="balance">¥ 0</div>
  <div class="actions">
    <button class="btn-income">収 入</button>
    <button class="btn-expense">支 出</button>
  </div>
  <div class="card">
    <div class="toolbar">
      <input type="text" placeholder="項目、世話人、備考を探す" />
      <div class="export">
        <button>CSVに書き出す</button>
        <button>JSONに書き出す</button>
      </div>
    </div>
    <table>
      <thead><tr><th>時間</th><th>種類</th><th>項目</th><th>世話人</th><th>備考</th><th>金額</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <dialog>
    <div class="dialog-header">新規収入<button>×</button></div>
    <div class="dialog-body">
      <label>金額</label><input type="number">
      <label>時間</label><input type="datetime-local">
      <label>項目</label>
      <select><option>お小遣い</option><option>バス代</option><option>移動支援</option><option>その他</option></select>
      <label>世話人</label>
      <select><option>阿部</option><option>雨宮</option><option>川越</option><option>矢野</option><option>緒澤</option><option>石田</option><option>島雄</option><option>趙</option></select>
      <label>備考</label><textarea></textarea>
    </div>
    <div class="dialog-footer">
      <button class="cancel">取り消し</button>
      <button class="save">保存</button>
    </div>
  </dialog>
</body>
</html>
